<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>攻略メモ（攻略順）</title>
<style>
:root { --bg:#fff; --fg:#222; --sub:#666; --line:#ddd; --head:#f3f3f3; --link:#0b63c4; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#161616; --fg:#e8e8e8; --sub:#aaa; --line:#3a3a3a; --head:#242424; --link:#6fb0ff; }
}
body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
       font-family:system-ui, sans-serif; line-height:1.6; }
main { max-width:960px; margin:0 auto; }
a { color:var(--link); }
h1 { font-size:1.5rem; margin:.5rem 0 1rem; }
h2 { font-size:1.15rem; border-bottom:2px solid var(--line); padding-bottom:.2rem; margin-top:2rem; }
summary { font-size:1rem; font-weight:bold; margin:1.2rem 0 .5rem; cursor:pointer; }
.wrap { overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-size:.95rem; }
th, td { border:1px solid var(--line); padding:.35rem .5rem; text-align:left; vertical-align:top; white-space:pre-line; }
th { background:var(--head); white-space:nowrap; }
.empty, .err { color:var(--sub); }
/* スマホ幅ではステージごとに並べ替えた小さな表にする：1段目 名前、その下にエリア・報酬、解放要素を縦に並べる（空なら出さない） */
@media (max-width: 600px) {
  table, tbody { display:block; }
  thead { display:none; }
  tr { display:grid; grid-template-columns:1fr 1fr; margin-bottom:.6rem; border-top:1px solid var(--line); border-left:1px solid var(--line); }
  td { display:block; border:none; border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:.25rem .4rem; }
  td::before { content:attr(data-label); display:block; font-size:.75rem; color:var(--sub); }
  td.name { background:var(--head); }
  td.name { font-weight:bold; grid-column:1 / -1; }

  td.name::before, td[data-label="エリア"]::before { content:none; }
  /* エリアは名前の下に小さく左寄せ（名前と同じ見出しの段に見えるように） */
  td[data-label="エリア"] { background:var(--head); font-size:.8rem; padding-top:0; color:var(--sub); }
  td.name { border-bottom:none; }
  td[data-label="エリア"], td[data-label="解放要素"], td[data-label="報酬"] { grid-column:1 / -1; }
  td[data-label="エリア"] { order:1; } td[data-label="報酬"] { order:2; } td[data-label="解放要素"] { order:3; }
  td.blank[data-label="解放要素"], td.blank[data-label="報酬"] { display:none; }
}
</style>
</head>
<body>
<main>
  <nav><a href="index.html">← 目次</a></nav>
  <h1 id="title">攻略メモ（攻略順）</h1>
  <nav id="pager"></nav>
  <div id="stages">読み込み中…</div>
  <div id="memo"></div>
</main>
<script>
// data/route.json の stages に並べた順で、全エリアのステージを表示する
// sections のボス戦で区切ってページを分ける（strategy.html?p=1〜）。p がなければ各ページへのリンクを出す
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// 値の形に合わせて表示する（項目名は書きながら決めるため、決め打ちしない）
//   文字列 → 段落 / 文字列の配列 → 箇条書き / オブジェクトの配列 → 表
function render(v) {
  if (v == null || (Array.isArray(v) && v.length === 0)) return '<p class="empty">（未記入）</p>';
  if (typeof v !== "object") return `<p>${esc(v)}</p>`;
  if (!Array.isArray(v)) v = [v];
  if (v.every(x => typeof x !== "object")) return `<ul>${v.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  const keys = [...new Set(v.flatMap(Object.keys))].filter(k => k !== "id");  // id は表示しない
  const cell = x => x == null ? "" : esc(Array.isArray(x) ? x.join("、") : x);
  return `<div class="wrap"><table><thead><tr>${keys.map(k => `<th>${esc(k)}</th>`).join("")}</tr></thead>
    <tbody>${v.map(r => `<tr>${keys.map(k => { const c = cell(r[k]);
      const cls = c === "" ? "blank" : (k === "名前" || k === "クラス") ? "name" : "";  // 名前・クラスはスマホでカードの見出しになる
      return `<td data-label="${esc(k)}"${cls ? ` class="${cls}"` : ""}>${c}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>`;
}

const load = f => fetch(`data/${f}.json`).then(r => { if (!r.ok) throw new Error(`data/${f}.json が読めません`); return r.json(); });

// id の頭文字からエリア名を出す
const AREA = { c: "コルニア", d: "ドラケンガルド", e: "エルヘイム", b: "バストリアス", a: "アルビオン" };

Promise.all([load("route"), load("stages")]).then(([route, stages]) => {
  const byId = Object.fromEntries(stages.map(s => [s.id, s]));
  // 敵Lv は名前の後ろに「(Lv.N)」として付け、列としては出さない
  // 加入キャラは「加入：○○」として解放要素の先頭にまとめ、列としては出さない
  const row = s => {
    const parts = [];
    if (s.加入キャラ && s.加入キャラ.length) parts.push(`加入：${s.加入キャラ.join("、")}`);
    if (s.解放要素 && s.解放要素.length) parts.push(...s.解放要素);
    return { 名前: s.敵Lv != null ? `${s.名前}(Lv.${s.敵Lv})` : s.名前, エリア: AREA[s.id[0]] || "", 解放要素: parts.join("\n"),
             報酬: s.報酬 || "" };
  };
  // ボス戦の後ろで区切る。最後のボス（一角獣の覇王）のページはその後のステージまで含める
  const secs = route.sections || [];
  const groups = [[]];
  route.stages.forEach(id => { groups[groups.length - 1].push(id); if (secs.slice(0, -1).includes(id)) groups.push([]); });
  const nameOf = id => byId[id] ? byId[id].名前 : id;
  const titles = groups.map((g, i) => `${nameOf(secs[i] || g[g.length - 1])}まで`);
  const p = Number(new URLSearchParams(location.search).get("p"));
  const link = i => `<a href="strategy.html?p=${i + 1}">${esc(titles[i])}</a>`;
  if (!(p >= 1 && p <= groups.length)) {
    document.getElementById("stages").innerHTML = `<ol>${groups.map((g, i) => `<li>${link(i)}</li>`).join("")}</ol>`;
  } else {
    const i = p - 1;
    document.title = titles[i];
    document.getElementById("title").textContent = titles[i];
    document.getElementById("pager").innerHTML = [i > 0 ? `← ${link(i - 1)}` : "", i < groups.length - 1 ? `${link(i + 1)} →` : ""].filter(Boolean).join("　｜　");
    document.getElementById("stages").innerHTML = render(groups[i].map(id => byId[id] ? row(byId[id]) : { id, 状態: "stages.json に未登録" }));
  }
  document.getElementById("memo").innerHTML = route.memo && route.memo.length ? render(route.memo) : "";
}).catch(e => {
  document.getElementById("stages").innerHTML = `<p class="err">${esc(e.message)}</p>`;
});
</script>
</body>
</html>
