<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クラス</title>
<style>
:root { --bg:#fff; --fg:#222; --sub:#666; --line:#ddd; --head:#f3f3f3; --link:#0b63c4;
        --rSS:#b8860b; --rS:#78909c; --rA:#c62828; --rB:#1565c0; --rC:#689f38; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#161616; --fg:#e8e8e8; --sub:#aaa; --line:#3a3a3a; --head:#242424; --link:#6fb0ff;
          --rSS:#ffb300; --rS:#cfd8dc; --rA:#ff6b6b; --rB:#64a8ff; --rC:#aed581; }
}
body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
       font-family:system-ui, sans-serif; line-height:1.6; }
main { max-width:960px; margin:0 auto; }
a { color:var(--link); }
h1 { font-size:1.5rem; margin:.5rem 0 1rem; }
h2 { font-size:1.15rem; border-bottom:2px solid var(--line); padding-bottom:.2rem; margin-top:2rem; }
summary { font-size:1rem; font-weight:bold; margin:1.2rem 0 .5rem; cursor:pointer; }
.wrap { overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-size:.95rem; }
th, td { border:1px solid var(--line); padding:.35rem .5rem; text-align:left; vertical-align:top; white-space:pre-line; }
th { background:var(--head); white-space:nowrap; }
.empty, .err { color:var(--sub); }
/* スマホ幅では表を1件ずつのカード表示にする(項目名は各値の前に出す) */
@media (max-width: 600px) {
  table, tbody, tr, td { display:block; width:auto; }
  thead { display:none; }
  tr { border:1px solid var(--line); border-radius:6px; padding:.4rem .6rem; margin-bottom:.6rem; }
  td { display:inline-block; border:none; padding:.1rem 1rem .1rem 0; }
  td::before { content:attr(data-label) "："; color:var(--sub); font-size:.85rem; }
  td.name { display:block; font-weight:bold; }
  td.name::before { content:none; }
  td[data-label="解放要素"]::before { content:none; }  /* 中身に「加入：」「施設：」が付くので見出しは出さない */
  td.blank { display:none; }
  /* 基本情報(kv)はスマホでも表のまま */
  table.kv { display:table; width:100%; }
  table.kv tbody { display:table-row-group; }
  table.kv tr { display:table-row; border:none; padding:0; margin:0; }
  table.kv th, table.kv td { display:table-cell; border:1px solid var(--line); padding:.35rem .5rem; }
  table.kv td::before { content:none; }
  /* 雇用場所(hr)はスマホでもエリアごとに1つの表のまま(見出し行も出す) */
  table.hr { display:table; width:100%; }
  table.hr thead { display:table-header-group; }
  table.hr tbody { display:table-row-group; }
  table.hr tr { display:table-row; border:none; border-radius:0; padding:0; margin:0; }
  table.hr th, table.hr td, table.hr td.blank { display:table-cell; border:1px solid var(--line); padding:.35rem .5rem; }
  table.hr td::before { content:none; }
  /* スキル(sk)はスキルごとに並べ替えた小さな表にする：1段目 名前と消費(右詰め)、2〜3段目 数値(3列)、最後 説明 */
  table.sk tr { display:grid; grid-template-columns:repeat(3, 1fr); padding:0; border-radius:0; border:none; border-top:1px solid var(--line); border-left:1px solid var(--line); }
  table.sk td, table.sk td.blank { display:block; border:none; border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:.25rem .4rem; }
  table.sk td::before { content:attr(data-label); display:block; font-size:.75rem; }
  table.sk td.name, table.sk td[data-label="説明"] { grid-column:1 / -1; }
  table.sk td.name { background:var(--head); }
  table.sk tr:has(td[data-label="消費"]) td.name { grid-column:1 / 3; border-right:none; }
  table.sk td[data-label="消費"] { background:var(--head); text-align:right; font-weight:bold; }
  /* スマホでの並び：名前・消費／物理威力・魔法威力・ヒット数／命中倍率・タイプ・特性／説明 */
  table.sk td.name { order:1; } table.sk td[data-label="消費"] { order:2; }
  table.sk td[data-label="物理威力"] { order:3; } table.sk td[data-label="魔法威力"] { order:4; } table.sk td[data-label="ヒット数"] { order:5; }
  table.sk td[data-label="命中倍率"] { order:6; } table.sk td[data-label="タイプ"] { order:7; } table.sk td[data-label="特性"] { order:8; }
  table.sk td[data-label="説明"] { order:9; }
  table.sk td.name::before, table.sk td[data-label="説明"]::before, table.sk td[data-label="消費"]::before { content:none; }
}
table.kv th { width:7em; }
p.memo { white-space:pre-line; }
.rSS { color:var(--rSS); } .rS { color:var(--rS); } .rA { color:var(--rA); } .rB { color:var(--rB); } .rC { color:var(--rC); }
h3 { font-size:1rem; margin:1rem 0 .4rem; }
/* 雇用場所の CC前／CC後 切り替えボタン */
.tabs { display:flex; gap:.4rem; margin:.6rem 0; }
.tabs button { padding:.3rem .9rem; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; cursor:pointer; }
.tabs button[aria-pressed="true"] { background:var(--head); border-color:var(--sub); font-weight:bold; }
</style>
</head>
<body>
<main>
  <nav><a href="classes.html">← クラス一覧</a></nav>
  <h1 id="title">クラス</h1>
  <div id="classes">読み込み中…</div>
</main>
<script>
// data/classes.json のクラスを1つ(class.html?id=k01 など)、「基本情報」「各スキル」の表と「評価」で表示する
// 雇用場所は classes.json の「雇用場所」(エリア名 → [{拠点, レベル}, …]。性別が決まっている拠点は名前の後ろに(♂)(♀)(♂♀))を評価の後に、エリアごとの小見出しと 拠点｜レベル の表にして出す(スマホでも表のまま)
// CC できるクラス(名前が「ロード／ハイロード」の形)は「ロード」「ハイロード」ごとに分けて書き、ボタンで切り替える。雇用場所が書いてある方だけボタンを出す
// どちらにも書いていなければ(雇用できないクラス)見出しごと出さない
// スキルの説明は skills.json・braves.json・leaders.json から引く
// 評価は「総合：S」のように見出しにしてその下にコメントを文章で出す。総合を先に、続けて攻略メモ(strategy.html?p=1〜)のページ名と同じ順に各段階を出す
// 各段階は、クラスが解放される段階から出す(それより前の段階は出さない)。解放がその段階の最後のボス戦なら次の段階から
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// 値の形に合わせて表示する(項目名は書きながら決めるため、決め打ちしない)
//   文字列 → 段落 / 文字列の配列 → 箇条書き / オブジェクトの配列 → 表
function render(v) {
  if (v == null || (Array.isArray(v) && v.length === 0)) return '<p class="empty">(未記入)</p>';
  if (typeof v !== "object") return `<p>${esc(v)}</p>`;
  if (!Array.isArray(v)) v = [v];
  if (v.every(x => typeof x !== "object")) return `<ul>${v.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  const keys = [...new Set(v.flatMap(Object.keys))].filter(k => k !== "id");  // id は表示しない
  const cell = x => x == null ? "" : esc(Array.isArray(x) ? x.join("、") : x);
  return `<div class="wrap"><table><thead><tr>${keys.map(k => `<th>${esc(k)}</th>`).join("")}</tr></thead>
    <tbody>${v.map(r => `<tr>${keys.map(k => { const c = cell(r[k]);
      const cls = c === "" ? "blank" : (k === "名前" || k === "クラス") ? "name" : "";  // 名前・クラスはスマホでカードの見出しになる
      return `<td data-label="${esc(k)}"${cls ? ` class="${cls}"` : ""}>${c}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>`;
}

const load = f => fetch(`data/${f}.json`, { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error(`data/${f}.json が読めません`); return r.json(); });

// 項目｜内容 の2列の表(クラスの基本情報用)
const kv = rows => `<div class="wrap"><table class="kv"><tbody>${rows.map(([k, v]) =>
  `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join("")}</tbody></table></div>`;

// 攻略メモのページ名(strategy.html と同じ作り方：sections のボス戦の名前＋「まで」)
const strategyTitles = (route, stages) => {
  const byId = Object.fromEntries(stages.map(s => [s.id, s]));
  return (route.sections || []).map(id => `${byId[id] ? byId[id].名前 : id}まで`);
};

// クラスの「解放」(例：「決起の矢先(Lv.2)」)のステージが、攻略メモの何段階目(0始まり)から使えるか
// stages.json で同じ名前のステージを探し、route.json の stages の並びで位置を出す。解放がボス戦ならその次の段階から
// ステージが見つからなければ 0(全段階を出す)
const firstSection = (unlock, route, stages) => {
  const name = String(unlock || "").split("(")[0];
  const ids = stages.filter(s => s.名前 === name).map(s => s.id);
  const pos = route.stages.findIndex(id => ids.includes(id));
  if (pos < 0) return 0;
  const secs = (route.sections || []).map(id => route.stages.indexOf(id));
  const i = secs.findIndex(e => pos <= e);
  return i < 0 ? secs.length : secs[i] === pos ? i + 1 : i;
};

Promise.all([load("classes"), load("skills"), load("braves"), load("leaders"), load("route"), load("stages")]).then(([list, skills, braves, leaders, route, stages]) => {
  const sk = Object.fromEntries(skills.map(x => [x.名前, x]));
  const bv = Object.fromEntries(braves.map(x => [x.名前, x]));
  const ld = Object.fromEntries(leaders.map(x => [x.名前, x]));
  // 「名前(LvN)、…」を [名前, N] の並びに分ける
  const withLv = str => (str || "").split("、").filter(Boolean).map(t => { const m = t.match(/^(.+)\((CC,)?Lv(\d+)\)$/); return m ? [m[1], (m[2] || "") + "Lv." + m[3]] : [t, ""]; });  // 「名前(Lv1)」「名前(CC,Lv25)」→ [名前, "Lv.1" / "CC,Lv.25"]
  // ブレイブは「CC前のもの／CC後のもの」。CC後に増えるものに(CC)を付ける
  const braveList = str => {
    const [base, cc] = (str || "").split("／");
    const names = s => (s || "").split("、").filter(Boolean).map(t => t.replace(/\(\d+\)$/, ""));
    const b = names(base), c = cc === undefined ? [] : names(cc);
    return [...b.map(n => [n, ""]), ...c.filter(n => !b.includes(n)).map(n => [n, "CC"])];
  };
  const id = new URLSearchParams(location.search).get("id");
  const idx = list.findIndex(c => c.id === id);
  if (idx < 0) throw new Error(`id=${id || ""} のクラスは data/classes.json にありません`);
  const titles = strategyTitles(route, stages);
  const html = [list[idx]].map(c => {
    const info = kv([["種別", c.種別], ["移動力", c.移動力], ["スタミナ", c.スタミナ], ["キャラ", (c.キャラ || []).join("、")], ["解放", c.解放]]);
    const leader = (c.リーダー効果 || "").split("・").filter(Boolean).map(n => ({ 名前: n, 説明: (ld[n] || {}).効果 || "" }));
    // 習得Lvは名前の後ろに付ける。威力などは appmedia の項目と同じものを並べる
    const skillRow = (n, lv, pre) => { const x = sk[n] || {};
      return { 名前: lv ? `${n}(${lv})` : n, 消費: `${pre}${x.消費 || ""}`, タイプ: x.タイプ || "", 物理威力: x.物理威力 || "", 魔法威力: x.魔法威力 || "",
               ヒット数: x.ヒット数 || "", 命中倍率: x.命中倍率 || "", 特性: x.特性 || "", 説明: x.効果 || "" }; };
    const active = withLv(c.アクティブスキル).map(([n, lv]) => skillRow(n, lv, "AP"));
    const passive = withLv(c.パッシブスキル).map(([n, lv]) => skillRow(n, lv, "PP"));
    const brave = braveList(c.ブレイブスキル).map(([n, note]) => ({ 名前: note ? `${n}(${note})` : n, 消費: `BP${(bv[n] || {}).消費 || ""}`, 説明: (bv[n] || {}).効果 || "" }));
    const skt = rows => render(rows).replace("<table>", '<table class="sk">');  // スキルの表(スマホでも表のまま)
    // 評価(SS/S/A+/A/B/C)。SS〜C なら色を付ける(A+ は A と同じ色)
    const ev = c.評価 || {};
    const rank = e => { const r = String((e || {}).評価 || ""); return `<span class="${/^(SS|A\+|[SABC])$/.test(r) ? "r" + r.replace("+", "") : ""}">${esc(r)}</span>`; };
    // 1段階ぶん：見出しを「名前：S」にし、その下にコメントを文章で出す(改行はそのまま出す。空欄なら(未記入))
    const block = (name, e) => { e = e || {};
      return `<h3>${name}：${rank(e)}</h3>`
        + (e.コメント ? `<p class="memo">${esc(e.コメント)}</p>` : '<p class="empty">(未記入)</p>'); };
    // 総合 → 各段階(段階名は攻略メモの各ページへのリンク)。解放される段階より前は出さない
    const from = firstSection(c.解放, route, stages);
    const evals = `<h2>評価</h2>${block("総合", ev.総合)}`
      + titles.map((k, i) => i < from ? "" : block(`<a href="strategy.html?p=${i + 1}">${esc(k)}</a>`, ev[k])).join("");
    const forms = c.クラス.split("／");
    const hireData = forms.length > 1 ? (c.雇用場所 || {}) : { [forms[0]]: c.雇用場所 || {} };
    const hireForms = forms.filter(f => Object.keys(hireData[f] || {}).length);
    const areaTables = f => Object.entries(hireData[f]).map(([a, rows]) => `<h3>${esc(a)}</h3>${render(rows).replace("<table>", '<table class="hr">')}`).join("");
    const hire = !hireForms.length ? "" : "<h2>雇用場所</h2>" + (forms.length > 1
      ? `<div class="tabs">${hireForms.map((f, i) => `<button type="button" data-form="${i}" aria-pressed="${i === 0}">${esc(f)}</button>`).join("")}</div>`
        + hireForms.map((f, i) => `<div class="form" data-form="${i}"${i ? " hidden" : ""}>${areaTables(f)}</div>`).join("")
      : areaTables(forms[0]));
    return `<h3>基本情報</h3>${info}`
      + `<h3>リーダー効果</h3>${skt(leader)}<h3>アクティブスキル</h3>${skt(active)}`
      + `<h3>パッシブスキル</h3>${skt(passive)}<h3>ブレイブスキル</h3>${skt(brave)}${evals}${hire}`;
  }).join("");
  const c = list[idx];
  document.title = c.クラス;
  document.getElementById("title").textContent = c.クラス;
  document.getElementById("classes").innerHTML = html;
  // 雇用場所の切り替えボタン：押したボタンのクラスの表だけ出す
  document.getElementById("classes").addEventListener("click", e => {
    const b = e.target.closest(".tabs button"); if (!b) return;
    document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-pressed", x === b));
    document.querySelectorAll("div.form").forEach(d => d.hidden = d.dataset.form !== b.dataset.form);
  });
}).catch(e => {
  document.getElementById("classes").innerHTML = `<p class="err">${esc(e.message)}</p>`;
});
</script>
</body>
</html>
