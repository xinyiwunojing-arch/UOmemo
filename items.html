<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おすすめアイテム</title>
<style>
:root { --bg:#fff; --fg:#222; --sub:#666; --line:#ddd; --head:#f3f3f3; --link:#0b63c4; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#161616; --fg:#e8e8e8; --sub:#aaa; --line:#3a3a3a; --head:#242424; --link:#6fb0ff; }
}
body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
       font-family:system-ui, sans-serif; line-height:1.6; }
main { max-width:960px; margin:0 auto; }
a { color:var(--link); }
h1 { font-size:1.5rem; margin:.5rem 0 1rem; }
h2 { font-size:1.15rem; border-bottom:2px solid var(--line); padding-bottom:.2rem; margin-top:2rem; }
table { border-collapse:collapse; width:100%; font-size:.95rem; }
th, td { border:1px solid var(--line); padding:.35rem .5rem; text-align:left; vertical-align:top; white-space:pre-line; }
th { background:var(--head); white-space:nowrap; width:6em; }
.empty, .err { color:var(--sub); }
</style>
</head>
<body>
<main>
  <nav><a href="index.html">← 目次</a></nav>
  <h1>おすすめアイテム</h1>
  <div id="items">読み込み中…</div>
</main>
<script>
// data/items.json のアイテムを、アイテム名を見出しにして「項目｜内容」の表で並べる
// 項目は JSON に書いた順にそのまま出す（id と 名前 は表に出さない）
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

fetch("data/items.json").then(r => { if (!r.ok) throw new Error("data/items.json が読めません"); return r.json(); }).then(list => {
  const item = x => {
    const rows = Object.entries(x).filter(([k]) => k !== "id" && k !== "名前")
      .map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(Array.isArray(v) ? v.join("、") : v)}</td></tr>`).join("");
    return `<h2>${esc(x.名前)}</h2><table><tbody>${rows}</tbody></table>`;
  };
  document.getElementById("items").innerHTML = list.length ? list.map(item).join("") : '<p class="empty">（未記入）</p>';
}).catch(e => {
  document.getElementById("items").innerHTML = `<p class="err">${esc(e.message)}</p>`;
});
</script>
</body>
</html>
