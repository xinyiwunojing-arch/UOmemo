<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>攻略メモ</title>
<style>
:root { --bg:#fff; --fg:#222; --sub:#666; --line:#ddd; --head:#f3f3f3; --link:#0b63c4; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#161616; --fg:#e8e8e8; --sub:#aaa; --line:#3a3a3a; --head:#242424; --link:#6fb0ff; }
}
body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
       font-family:system-ui, sans-serif; line-height:1.6; }
main { max-width:960px; margin:0 auto; }
a { color:var(--link); }
h1 { font-size:1.5rem; margin:.5rem 0 1rem; }
h2 { font-size:1.15rem; border-bottom:2px solid var(--line); padding-bottom:.2rem; margin-top:2rem; }
.wrap { overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-size:.95rem; }
th, td { border:1px solid var(--line); padding:.35rem .5rem; text-align:left; vertical-align:top; white-space:pre-line; }
th { background:var(--head); white-space:nowrap; }
.empty, .err { color:var(--sub); }
/* スマホ幅では表を1件ずつのカード表示にする（項目名は各値の前に出す） */
@media (max-width: 600px) {
  table, tbody, tr, td { display:block; width:auto; }
  thead { display:none; }
  tr { border:1px solid var(--line); border-radius:6px; padding:.4rem .6rem; margin-bottom:.6rem; }
  td { display:inline-block; border:none; padding:.1rem 1rem .1rem 0; }
  td::before { content:attr(data-label) "："; color:var(--sub); font-size:.85rem; }
  td.name { display:block; font-weight:bold; }
  td.name::before { content:none; }
  td[data-label="解放要素"]::before { content:none; }  /* 中身に「加入：」「施設：」が付くので見出しは出さない */
  td.blank { display:none; }
}
</style>
</head>
<body>
<main>
  <nav><a href="index.html">← 目次</a></nav>
  <h1 id="title">読み込み中…</h1>
  <section id="maps-sec" hidden><h2>宝の地図</h2><div id="maps"></div></section>
  <section id="tablets-sec" hidden><h2>石板</h2><div id="tablets"></div></section>
  <section id="graves-sec" hidden><h2>墓所</h2><div id="graves"></div></section>
  <section id="towers-sec" hidden><h2>塔・見張り台</h2><div id="towers"></div></section>
  <section id="stones-sec" hidden><h2>環状列石</h2><div id="stones"></div></section>
  <section id="windgates-sec" hidden><h2>風門</h2><div id="windgates"></div></section>
</main>
<script>
// 使い方: chapter.html?ch=01 → data/01.json を表示する
const ch = new URLSearchParams(location.search).get("ch") || "01";

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// 値の形に合わせて表示する（項目名は書きながら決めるため、決め打ちしない）
//   文字列 → 段落 / 文字列の配列 → 箇条書き / オブジェクトの配列 → 表
function render(v) {
  if (v == null || (Array.isArray(v) && v.length === 0)) return '<p class="empty">（未記入）</p>';
  if (typeof v !== "object") return `<p>${esc(v)}</p>`;
  if (!Array.isArray(v)) v = [v];
  if (v.every(x => typeof x !== "object")) return `<ul>${v.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  const keys = [...new Set(v.flatMap(Object.keys))].filter(k => k !== "id");  // id は表示しない
  const cell = x => x == null ? "" : esc(Array.isArray(x) ? x.join("、") : x);
  return `<div class="wrap"><table><thead><tr>${keys.map(k => `<th>${esc(k)}</th>`).join("")}</tr></thead>
    <tbody>${v.map(r => `<tr>${keys.map(k => { const c = cell(r[k]);
      const cls = c === "" ? "blank" : (k === "名前" || k === "クラス") ? "name" : "";  // 名前・クラスはスマホでカードの見出しになる
      return `<td data-label="${esc(k)}"${cls ? ` class="${cls}"` : ""}>${c}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>`;
}

const load = f => fetch(`data/${f}.json`).then(r => { if (!r.ok) throw new Error(`data/${f}.json が読めません`); return r.json(); });

load(ch).then(d => {
  document.title = `${d.title} | 攻略メモ`;
  document.getElementById("title").textContent = d.title;
  // 宝の地図(maps.json)・石板(tablets.json)・墓所(graves.json)・塔(towers.json)・環状列石(stones.json)・風門(windgates.json)を、章データに並べた id で引いて表示する
  // 指定がない種類は見出しごと出さない
  const sub = (key, file) => (d[key] && d[key].length) ? load(file).then(list => {
    const byKey = Object.fromEntries(list.map(x => [x.id, x]));
    let rows = d[key].map(id => byKey[id] || { id, 状態: `${file}.json に未登録` });
    // 石板・墓所の報酬はクエスト全体の報酬なので、表の列にせず表の上に独立して書く
    let after = "";
    const notes = { tablets: "※ヤーナの加入が必要", graves: "※シャロンの加入が必要",
                    stones: "※イシリオンの加入が必要（調べると隕鉄石を入手）",
                    windgates: "※フィールドクエスト「風神の武具」の発生後に調べると、番人との戦闘" };
    if (key in notes) {
      const all = rows.flatMap(r => r.報酬 || []);
      rows = rows.map(({ 報酬, ...r }) => r);
      if (all.length) after += `<p>クリア報酬：${esc(all.join("、"))}</p>`;
      after += `<p>${esc(notes[key])}</p>`;
    }
    document.getElementById(key).innerHTML = after + render(rows);
    document.getElementById(`${key}-sec`).hidden = false;
  }) : null;
  return Promise.all([sub("maps", "maps"), sub("tablets", "tablets"), sub("graves", "graves"), sub("towers", "towers"), sub("stones", "stones"), sub("windgates", "windgates")]);
}).catch(e => {
  document.getElementById("title").textContent = "読み込みエラー";
  document.querySelector("main").insertAdjacentHTML("beforeend", `<p class="err">${esc(e.message)}</p>`);
});
</script>
</body>
</html>
