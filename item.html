<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おすすめ</title>
<style>
:root { --bg:#fff; --fg:#222; --sub:#666; --line:#ddd; --head:#f3f3f3; --link:#0b63c4; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#161616; --fg:#e8e8e8; --sub:#aaa; --line:#3a3a3a; --head:#242424; --link:#6fb0ff; }
}
body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
       font-family:system-ui, sans-serif; line-height:1.6; }
main { max-width:960px; margin:0 auto; }
a { color:var(--link); }
h1 { font-size:1.5rem; margin:.5rem 0 1rem; }
table { border-collapse:collapse; width:100%; font-size:.95rem; }
th, td { border:1px solid var(--line); padding:.35rem .5rem; text-align:left; vertical-align:top; white-space:pre-line; }
th { background:var(--head); white-space:nowrap; width:6em; }
h2 { font-size:1.1rem; margin:1.5rem 0 .5rem; }
.weapon td { width:50%; }
.wrap { overflow-x:auto; }
table.sk th, table.cls th { width:auto; }
h3 { font-size:1rem; margin:1rem 0 .4rem; }
.empty, .err { color:var(--sub); }
/* 装備スキルの表（sk）は class.html のスキルの表と同じ見た目にする。スマホ幅では 1段目 名前と消費（右詰め）、2〜3段目 数値（3列）、最後 説明 */
@media (max-width: 600px) {
  table.sk, table.sk tbody, table.sk td { display:block; width:auto; }
  table.sk thead { display:none; }
  table.sk tr { display:grid; grid-template-columns:repeat(3, 1fr); border-top:1px solid var(--line); border-left:1px solid var(--line); }
  table.sk td { border:none; border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:.25rem .4rem; }
  table.sk td::before { content:attr(data-label); display:block; font-size:.75rem; color:var(--sub); }
  table.sk td.name, table.sk td[data-label="説明"] { grid-column:1 / -1; }
  table.sk td.name { background:var(--head); font-weight:bold; }
  table.sk tr:has(td[data-label="消費"]) td.name { grid-column:1 / 3; border-right:none; }
  table.sk td[data-label="消費"] { background:var(--head); text-align:right; font-weight:bold; }
  table.sk td.name { order:1; } table.sk td[data-label="消費"] { order:2; }
  table.sk td[data-label="物理威力"] { order:3; } table.sk td[data-label="魔法威力"] { order:4; } table.sk td[data-label="ヒット数"] { order:5; }
  table.sk td[data-label="命中倍率"] { order:6; } table.sk td[data-label="タイプ"] { order:7; } table.sk td[data-label="特性"] { order:8; }
  table.sk td[data-label="説明"] { order:9; }
  table.sk td.name::before, table.sk td[data-label="説明"]::before, table.sk td[data-label="消費"]::before { content:none; }
}
</style>
</head>
<body>
<main>
  <nav><a id="back" href="index.html">← 目次</a></nav>
  <h1 id="title">おすすめ</h1>
  <div id="item">読み込み中…</div>
</main>
<script>
// おすすめの武器・盾・アクセサリ・アイテムを1つ（item.html?k=weapons&id=w01 など）、「項目｜内容」の表で表示する
//   k は種類（items.html と同じ：weapons・shields・accessories・items）、id は data/{k}.json の id
// 項目は JSON に書いた順にそのまま出す（id と 名前 は表に出さない）
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KINDS = { weapons: "武器", shields: "盾", accessories: "アクセサリ", items: "アイテム" };
const q = new URLSearchParams(location.search), k = q.get("k"), id = q.get("id");
// 武器はゲームの画面にあわせて、見出しなしの表で物理攻撃・魔法攻撃を1行に並べ、その下に装備時効果（装備スキルの名前・効果）を1行ずつ出す（ない分の行は出さない）
// 装備スキルは表の下に、class.html と同じスキルの表（data/skills.json から引く）で出す。入手方法など、ほかの項目はその下に見出しを付けて出す
const has = s => s && s !== "なし";
const skillTable = (n, sk) => { const x = sk[n] || {};
  const r = { 名前: n, 消費: `${x.種類 === "パッシブ" ? "PP" : "AP"}${x.消費 || ""}`, タイプ: x.タイプ || "", 物理威力: x.物理威力 || "", 魔法威力: x.魔法威力 || "",
              ヒット数: x.ヒット数 || "", 命中倍率: x.命中倍率 || "", 特性: x.特性 || "", 説明: x.効果 || "" };
  return `<div class="wrap"><table class="sk"><thead><tr>${Object.keys(r).map(k => `<th>${k}</th>`).join("")}</tr></thead>`
    + `<tbody><tr>${Object.entries(r).map(([k, v]) => `<td data-label="${k}"${k === "名前" ? ' class="name"' : ""}>${esc(v)}</td>`).join("")}</tr></tbody></table></div>`; };
// 装備可能クラス：武器に「装備可能クラス」（classes.json のクラス名の並び）があればそのクラス、なければ classes.json の「武器」が武器の「種別」（剣・槍・斧など）と同じクラスを、
// 見出しなしの1列の表で出す（クラス名は個別ページへのリンク）
const classTable = (x, classes) => { const list = classes.filter(c => x.装備可能クラス ? x.装備可能クラス.includes(c.クラス) : c.武器 === x.種別);
  return list.length ? `<div class="wrap"><table class="cls"><tbody>`
    + list.map(c => `<tr><td><a href="class.html?id=${encodeURIComponent(c.id)}">${esc(c.クラス)}</a></td></tr>`).join("")
    + `</tbody></table></div>` : '<p class="empty">（なし）</p>'; };
const weaponHtml = (x, sk, classes) => {
  const stats = String(x.ステータス || "").split("、").map(s => s.replace(/(\d+)$/, " $1"));
  const effects = [x.装備スキル, ...String(x.効果 || "").split("、")].filter(has);
  const rest = Object.entries(x).filter(([k, v]) => !["id", "名前", "種別", "装備可能クラス", "ステータス", "効果", "装備スキル"].includes(k) && has(v));
  return `<h2>基本性能</h2><table class="weapon"><tbody><tr>${stats.map(s => `<td>${esc(s)}</td>`).join("")}</tr>`
    + effects.map(s => `<tr><td colspan="${stats.length}">${esc(s)}</td></tr>`).join("")
    + `</tbody></table>`
    + (has(x.装備スキル) ? `<h2>装備スキル</h2>${skillTable(x.装備スキル, sk)}` : "")
    + `<h2>装備可能クラス</h2>${classTable(x, classes)}`
    + rest.map(([k, v]) => `<h2>${esc(k)}</h2>` + (k === "入手方法" ? howTable(v)
        : `<p>${esc(Array.isArray(v) ? v.join("、") : v)}</p>`)).join("");
};
// 入手方法を「／」で分けて、種類（購入・クエスト・闘技場）ごとに小見出しを付け、その下に1列の表で並べる
//   店で購入（12000G）：コルニア（港町ウーヴリール）→ 購入｜値段（12000G）は表の上に書き、表には 港町ウーヴリール(コルニア) と町を1行ずつ
//   クエスト「…」の… → クエスト｜「…」の…　／　闘技場の… → 闘技場｜…　／　それ以外は小見出しなしでそのまま
const howTable = v => String(v).split("／").map(t => {
  const shop = t.match(/^店で購入（(.+?)）：(.+)$/);
  if (shop) return ["購入", [...shop[2].matchAll(/([^、（]+)（([^）]+)）/g)].flatMap(([, area, ts]) => ts.split("、").map(town => `${town}(${area})`)), shop[1]];
  const m = t.match(/^(クエスト|闘技場の)(.+)$/);
  return m ? [m[1].replace(/の$/, ""), [m[2]]] : ["", [t]];
}).map(([k, rows, price]) => (k ? `<h3>${esc(k)}</h3>` : "") + (price ? `<p>${esc(price)}</p>` : "")
  + `<table class="how"><tbody>${rows.map(r => `<tr><td>${esc(r)}</td></tr>`).join("")}</tbody></table>`).join("");

(Object.hasOwn(KINDS, k || "") ? Promise.resolve() : Promise.reject(new Error(`k=${k || ""} の種類はありません（weapons・shields・accessories・items のどれか）`))).then(() => {
  const back = document.getElementById("back");
  back.href = `items.html?k=${k}`;
  back.textContent = `← おすすめ${KINDS[k]}`;
  const get = f => fetch(`data/${f}.json`).then(r => { if (r.status === 404) return []; if (!r.ok) throw new Error(`data/${f}.json が読めません`); return r.json(); });
  return Promise.all([get(k), k === "weapons" ? get("skills") : [], k === "weapons" ? get("classes") : []]);
}).then(([list, skills, classes]) => {
  const x = list.find(x => x.id === id);
  if (!x) throw new Error(`id=${id || ""} の${KINDS[k]}は data/${k}.json にありません`);
  document.title = document.getElementById("title").textContent = x.名前;
  if (k === "weapons") { document.getElementById("item").innerHTML = weaponHtml(x, Object.fromEntries(skills.map(s => [s.名前, s])), classes); return; }
  const rows = Object.entries(x).filter(([k]) => k !== "id" && k !== "名前")
    .map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(Array.isArray(v) ? v.join("、") : v)}</td></tr>`).join("");
  document.getElementById("item").innerHTML = `<table><tbody>${rows}</tbody></table>`;
}).catch(e => {
  document.getElementById("item").innerHTML = `<p class="err">${esc(e.message)}</p>`;
});
</script>
</body>
</html>
