<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クラス評価</title>
<style>
:root { --bg:#fff; --fg:#222; --sub:#666; --line:#ddd; --head:#f3f3f3; --link:#0b63c4;
        --rS:#b8860b; --rA:#c62828; --rB:#1565c0; --rC:#689f38; --rD:#757575; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#161616; --fg:#e8e8e8; --sub:#aaa; --line:#3a3a3a; --head:#242424; --link:#6fb0ff;
          --rS:#ffb300; --rA:#ff6b6b; --rB:#64a8ff; --rC:#aed581; --rD:#9e9e9e; }
}
body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
       font-family:system-ui, sans-serif; line-height:1.6; }
main { max-width:960px; margin:0 auto; }
a { color:var(--link); }
h1 { font-size:1.5rem; margin:.5rem 0 1rem; }
.wrap { overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-size:.95rem; }
th, td { border:1px solid var(--line); padding:.35rem .5rem; text-align:left; vertical-align:top; }
th { background:var(--head); white-space:nowrap; }
/* 並び替え：総合評価／加入順のバー（1つのボタン。押すたびに切り替わり、選んでいる側が濃くなる）と、昇順・降順を切り替えるボタン */
#sort { display:flex; gap:.5rem; margin-bottom:.8rem; }
#sort button { font:inherit; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); cursor:pointer; white-space:nowrap; }
#bar { display:flex; flex:1; padding:0; overflow:hidden; }
#bar span { flex:1; padding:.35rem .6rem; text-align:center; }
#bar span + span { border-left:1px solid var(--line); }
#bar span.on { background:var(--head); font-weight:bold; }
#dir { padding:.35rem .6rem; }
td.rank { text-align:center; white-space:nowrap; font-weight:bold; }
.rS { color:var(--rS); } .rA { color:var(--rA); } .rB { color:var(--rB); } .rC { color:var(--rC); } .rD { color:var(--rD); }
.err { color:var(--sub); }
</style>
</head>
<body>
<main>
  <nav><a href="index.html">← 目次</a></nav>
  <h1>クラス評価</h1>
  <div id="sort"><button id="bar"><span data-sort="rank">総合評価</span><span data-sort="join">加入順</span></button><button id="dir">🔼</button></div>
  <div id="classes">読み込み中…</div>
</main>
<script>
// data/classes.json の全クラスを「総合｜クラス｜ネームド」の表で並べる。クラス名は個別ページ（class.html?id=k01 など）へのリンク
// 表の上のバーを押すたびに「総合評価」「加入順」が切り替わり、🔼（昇順）／🔽（降順）のボタンで向きを切り替える。最初は加入順の昇順
//   加入順：classes.json の並び（クラスの解放順）
//   総合評価：S→A→B→C→D→その他→未記入（降順でも未記入は最後）。同じ評価どうしは加入順
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const RANKS = ["S", "A", "B", "C", "D"];

fetch("data/classes.json").then(r => { if (!r.ok) throw new Error("data/classes.json が読めません"); return r.json(); }).then(list => {
  const total = c => String(((c.評価 || {}).総合 || {}).評価 || "");
  const rankKey = c => { const r = total(c); const i = RANKS.indexOf(r); return i >= 0 ? i : r ? RANKS.length : RANKS.length + 1; };
  const row = c => { const r = total(c);
    return `<tr><td class="rank${RANKS.includes(r) ? " r" + r : ""}">${esc(r)}</td>`
      + `<td><a href="class.html?id=${encodeURIComponent(c.id)}">${esc(c.クラス)}</a></td><td>${esc((c.キャラ || []).join("、"))}</td></tr>`; };
  let sort = "join", desc = false;
  const show = () => {
    const sign = desc ? -1 : 1;
    const rows = list.map((c, i) => [c, i]).sort((a, b) => {
      if (sort === "join") return sign * (a[1] - b[1]);
      const ka = rankKey(a[0]), kb = rankKey(b[0]);
      if (ka !== kb && (ka > RANKS.length || kb > RANKS.length)) return ka - kb;  // 未記入はいつも最後
      return sign * (ka - kb || a[1] - b[1]);
    });
    document.getElementById("classes").innerHTML = `<div class="wrap"><table><thead><tr><th>総合</th><th>クラス</th><th>ネームド</th></tr></thead>`
      + `<tbody>${rows.map(([c]) => row(c)).join("")}</tbody></table></div>`;
    document.querySelectorAll("#bar span").forEach(x => x.classList.toggle("on", x.dataset.sort === sort));
    document.getElementById("dir").textContent = desc ? "🔽" : "🔼";
  };
  document.getElementById("bar").addEventListener("click", () => { sort = sort === "join" ? "rank" : "join"; show(); });
  document.getElementById("dir").addEventListener("click", () => { desc = !desc; show(); });
  show();
}).catch(e => {
  document.getElementById("classes").innerHTML = `<p class="err">${esc(e.message)}</p>`;
});
</script>
</body>
</html>
